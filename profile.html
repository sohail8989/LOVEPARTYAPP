<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVER PARTY APP - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d0b21;
            color: #ffffff;
            padding-bottom: 80px;
        }
        .header-bar {
            background-color: #121029;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #1f1b42;
        }
        .profile-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff3366;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            cursor: pointer;
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .upload-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            font-size: 10px;
            text-align: center;
            padding: 2px 0;
            color: #fff;
        }
        .user-name {
            margin-top: 12px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-id {
            color: #8c88b4;
            font-size: 13px;
            margin-top: 4px;
        }
        
        /* Level Progress Section */
        .level-box {
            width: 100%;
            max-width: 400px;
            background-color: #171433;
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #2b255c;
        }
        .level-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #0d0b21;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            width: 0%;
            transition: width 0.4s ease;
        }
        .level-details-text {
            font-size: 11px;
            color: #8c88b4;
            margin-top: 6px;
            text-align: right;
        }

        /* Features Grid */
        .features-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .feature-btn {
            background-color: #171433;
            border: 1px solid #2b255c;
            border-radius: 12px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            text-align: center;
            gap: 6px;
        }
        .feature-btn:active {
            transform: scale(0.95);
            background-color: #201b45;
        }
        .feature-btn span.icon {
            font-size: 20px;
        }

        /* VIP Special Card */
        .vip-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #2c1a00;
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121029;
            border-top: 1px solid #1f1b42;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #7b76a6;
            text-decoration: none;
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: #ff3366;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-content {
            background-color: #171433;
            border: 1px solid #2b255c;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #ff3366;
            font-size: 18px;
            cursor: pointer;
        }
        .vip-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #2b255c;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header-bar">My Profile</div>

    <div class="profile-container">
        <!-- Profile Picture with Gallery Upload -->
        <div class="avatar-wrapper" onclick="document.getElementById('fileInput').click()">
            <img id="profilePic" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="User Avatar">
            <div class="upload-overlay">Edit</div>
        </div>
        <input type="file" id="fileInput" style="display: none;" accept="image/*" onchange="previewImage(event)">

        <div class="user-name">
            <span id="userNameDisplay">Muhammad Farhan</span>
            <span style="font-size: 14px; background: #ff3366; padding: 2px 8px; border-radius: 10px;" id="userLevelBadge">Lv.1</span>
        </div>
        <div class="user-id">ID: <span id="userIdDisplay">849201</span></div>

        <!-- Real Level Progress Box -->
        <div class="level-box">
            <div class="level-info">
                <span id="currentLevelText">Level 1</span>
                <span id="coinsProgressText">0 / 10,000 Coins</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="levelProgressBar"></div>
            </div>
            <div class="level-details-text" id="nextLevelInfo">Next Level (Level 2) at 20,000 coins</div>
        </div>

        <!-- VIP Special Banner Button (1 to 25 Levels, Double pricing) -->
        <div class="vip-card" onclick="openVipModal()">
            <div>
                <div style="font-size: 16px;">👑 VIP Membership</div>
                <div style="font-size: 11px; font-weight: normal; opacity: 0.8;">Upgrade VIP 1 ($20) to VIP 25</div>
            </div>
            <div>View &rarr;</div>
        </div>

        <!-- Features Grid Buttons -->
        <div class="features-grid">
            <div class="feature-btn" onclick="openFeature('Wallet')">
                <span class="icon">💰</span> Wallet
            </div>
            <div class="feature-btn" onclick="openFeature('Withdrawal')">
                <span class="icon">💸</span> Withdrawal
            </div>
            <div class="feature-btn" onclick="openFeature('CP')">
                <span class="icon">💍</span> CP (2.5L)
            </div>
            <div class="feature-btn" onclick="openFeature('Games')">
                <span class="icon">🎲</span> Greedy Game
            </div>
            <div class="feature-btn" onclick="openFeature('Invite')">
                <span class="icon">🔗</span> Invite
            </div>
            <div class="feature-btn" onclick="openFeature('Rank')">
                <span class="icon">🏆</span> Rank
            </div>
            <div class="feature-btn" onclick="openFeature('Medal Wall')">
                <span class="icon">🏅</span> Medal Wall
            </div>
            <div class="feature-btn" onclick="openFeature('Reward')">
                <span class="icon">🎁</span> Reward
            </div>
            <div class="feature-btn" onclick="openFeature('Add Host')">
                <span class="icon">🎙️</span> Add Host
            </div>
            <div class="feature-btn" style="grid-column: span 3;" onclick="openFeature('Invite Agent')">
                <span class="icon">🤝</span> Invite Agent
            </div>
        </div>
    </div>

    <!-- VIP Modal List (VIP 1 to 25 with double rates) -->
    <div class="modal" id="vipModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>VIP Levels (1 to 25)</span>
                <button class="close-btn" onclick="closeVipModal()">&times;</button>
            </div>
            <div id="vipListContainer">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </button>
        <button class="nav-item" onclick="alert('Discover section')">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Discover
        </button>
        <button class="nav-item" onclick="alert('Moments section')">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Moments
        </button>
        <button class="nav-item" onclick="alert('Chats section')">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            Chats
        </button>
        <button class="nav-item active" onclick="location.href='profile.html'">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </button>
    </div>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Real Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDsEDoAGFNF-CQknP25rhWP_RoxtvgeCjc",
            authDomain: "loverpartyapp.firebaseapp.com",
            databaseURL: "https://loverpartyapp-default-rtdb.firebaseio.com",
            projectId: "loverpartyapp",
            storageBucket: "loverpartyapp.firebasestorage.app",
            messagingSenderId: "1064077187047",
            appId: "1:1064077187047:web:24f05ce5328a31a9f34f42",
            measurementId: "G-K7BV8V510W"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userId = localStorage.getItem("loverPartyUserId") || "user_" + Math.floor(Math.random() * 100000);
        localStorage.setItem("loverPartyUserId", userId);

        const userRef = ref(db, 'users/' + userId);
        const giftsRef = ref(db, 'room/customizedGifts');

        // Load user data from Firebase Database on startup
        window.addEventListener('DOMContentLoaded', () => {
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    document.getElementById('userNameDisplay').innerText = data.name || "Muhammad Farhan";
                    document.getElementById('userIdDisplay').innerText = data.customId || userId.slice(-6);
                    if(data.photoUrl) {
                        document.getElementById('profilePic').src = data.photoUrl;
                    }
                    updateLevelProgress(data.totalCoins || 0);
                } else {
                    set(userRef, {
                        name: "Muhammad Farhan",
                        customId: Math.floor(100000 + Math.random() * 900000),
                        totalCoins: 0,
                        photoUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
                    });
                }
            });

            buildVipTable();
        });

        // Gallery Image Upload preview & save to Firebase
        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let base64Img = e.target.result;
                    document.getElementById('profilePic').src = base64Img;
                    update(userRef, { photoUrl: base64Img });
                }
                reader.readAsDataURL(file);
            }
        }

        // Permanent Customized Gift Upload function to Firebase Database
        window.uploadPermanentCustomizedGift = function(name, price, videoBase64, callback) {
            const newGiftRef = push(giftsRef);
            set(newGiftRef, {
                name: name,
                price: price,
                src: videoBase64,
                type: "video",
                uploadedBy: "Muhammad Farhan"
            }).then(() => {
                if(callback) callback(true);
            }).catch((err) => {
                console.error("Gift upload error:", err);
                if(callback) callback(false);
            });
        }

        // Real Progressive Level System Calculation
        window.updateLevelProgress = function(coins) {
            let currentLevel = 1;
            let requiredCoinsForNext = 10000;
            let previousLevelThreshold = 0;

            for(let i = 1; i <= 50; i++) {
                let threshold = 10000 * Math.pow(2, i - 1);
                if(coins >= threshold) {
                    currentLevel = i + 1;
                    previousLevelThreshold = threshold;
                    requiredCoinsForNext = 10000 * Math.pow(2, i);
                } else {
                    requiredCoinsForNext = threshold;
                    break;
                }
            }

            let spanCoins = coins - previousLevelThreshold;
            let spanRequired = requiredCoinsForNext - previousLevelThreshold;
            let percentage = Math.min(100, (spanCoins / spanRequired) * 100);

            document.getElementById('userLevelBadge').innerText = `Lv.${currentLevel}`;
            document.getElementById('currentLevelText').innerText = `Level ${currentLevel}`;
            document.getElementById('coinsProgressText').innerText = `${coins.toLocaleString()} / ${requiredCoinsForNext.toLocaleString()} Coins`;
            document.getElementById('levelProgressBar').style.width = `${percentage}%`;
            document.getElementById('nextLevelInfo').innerText = `Next Level (Level ${currentLevel + 1}) at ${requiredCoinsForNext.toLocaleString()} coins`;
        }
    </script>

    <script>
        function openFeature(featureName) {
            if(featureName === 'CP') {
                alert('CP (Couple Profile) feature selected. Requires 250,000 coins to bind!');
            } else if(featureName === 'Games') {
                alert('Launching Real Greedy Game...');
            } else if(featureName === 'Wallet') {
                alert('Opening Wallet & Coin Recharge Center...');
            } else if(featureName === 'Withdrawal') {
                alert('Opening Withdrawal Center...');
            } else {
                alert(`Opening ${featureName} dashboard...`);
            }
        }

        function openVipModal() {
            document.getElementById('vipModal').style.display = 'flex';
        }
        function closeVipModal() {
            document.getElementById('vipModal').style.display = 'none';
        }

        function buildVipTable() {
            let container = document.getElementById('vipListContainer');
            let html = '';
            let currentPrice = 20;

            for(let i = 1; i <= 25; i++) {
                html += `<div class="vip-item">
                    <span>VIP ${i}</span>
                    <span style="color: #ffd700; font-weight: bold;">$${currentPrice}</span>
                </div>`;
                currentPrice *= 2;
            }
            container.innerHTML = html;
        }
    </script>
</body>
</html>
