<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVER PARTY APP - Live Room</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f0f1a;
            font-family: sans-serif;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- ZegoCloud UIKit Prebuilt Library -->
    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
        window.onload = function () {
            function getUrlParams(url) {
                let urlStr = url.split('?')[1];
                if (!urlStr) return {};
                const urlSearchParams = new URLSearchParams(urlStr);
                return Object.fromEntries(urlSearchParams.entries());
            }

            // Room aur User parameters setup for LOVER PARTY APP
            const urlParams = getUrlParams(window.location.href);
            const roomID = urlParams['roomID'] || 'LoverParty_' + (Math.floor(Math.random() * 10000) + "");
            const userID = Math.floor(Math.random() * 100000) + "";
            const userName = "User_" + userID;
            
            // Credentials
            const appID = 921546327;
            const serverSecret = "84b25c878bb7f199ee9d8dd93bf438f1";
            
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

            // Role configuration (Host / Audience)
            let role = urlParams['role'] || 'Host';
            role = role === 'Host' ? ZegoUIKitPrebuilt.Host : ZegoUIKitPrebuilt.Audience;

            let customConfig = {};
            if (role === 'Host') {
                customConfig = {
                    turnOnCameraWhenJoining: true,
                    showMyCameraToggleButton: true,
                    showAudioVideoSettingsButton: true,
                    showScreenSharingButton: false,
                    showTextChat: true,
                    showUserList: true,
                    layout: "Sidebar",
                    showLayoutButton: true,
                };
            } else {
                customConfig = {
                    turnOnCameraWhenJoining: false,
                    showMyCameraToggleButton: false,
                    showAudioVideoSettingsButton: true,
                    showTextChat: true,
                    showUserList: true,
                };
            }

            const zp = ZegoUIKitPrebuilt.create(kitToken);
            
            zp.joinRoom({
                container: document.querySelector("#root"),
                scenario: {
                    mode: ZegoUIKitPrebuilt.LiveStreaming,
                    config: {
                        role,
                    },
                },
                sharedLinks: [{
                    name: 'Invite Audience Link',
                    url: window.location.protocol + '//' + window.location.host + window.location.pathname + '?roomID=' + roomID + '&role=Audience',
                }],
                ...customConfig
            });
        };
    </script>
</body>
</html>
