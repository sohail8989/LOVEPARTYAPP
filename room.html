function sendGiftItem(item) {
    let currentCoins = BigInt(getOwnerCoins());
    let giftPrice = BigInt(item.price || 0);
    
    // 45% coin cut calculation (BigInt ke sath safe math)
    let platformCut = (giftPrice * 45n) / 100n;
    let netDeduction = giftPrice; // User se poori price deduct hogi

    if (currentCoins < netDeduction) {
        alert("Insufficient Coin Balance!");
        return;
    }

    let newBalance = currentCoins - netDeduction;
    localStorage.setItem(COIN_KEY, newBalance.toString());

    syncCoinDisplays();
    playGiftEffect(item);
    addChatLog("Gift 🎁", `${userName} sent ${item.name}! (Fee: ${platformCut} coins cut)`);
    closeGiftModal();
}

async function fetchZegoToken(userID) {
    try {
        const response = await fetch(`http://127.0.0.1:3000/getToken?userID=${userID}`);
        const data = await response.json();
        return data.token;
    } catch (error) {
        console.error("Token fetch error:", error);
        return "";
    }
}

            // Login room with token parameter
            await zg.loginRoom(roomId, token, { userID: userID, userName: userName }, { userUpdate: true });
            console.log("Zego Logged in securely with Token support!");
            
            return zg;
        } catch (error) {
            console.error("Zego Login Failed:", error);
        }
    }
// 1. Firebase database se seats ka data real-time listen karna
function listenToSeats(roomID) {
    const seatsRef = firebase.database().ref('rooms/' + roomID + '/seats');
    
    seatsRef.on('value', (snapshot) => {
        const seatsData = snapshot.val() || {};
        
        // Har seat ko update karna UI par
        for (let i = 1; i <= 8; i++) {
            let seatElement = document.getElementById('seat_' + i);
            if (!seatElement) continue;
            
            let userData = seatsData['seat_' + i];
            if (userData) {
                // Agar seat occupied hai
                seatElement.classList.add('occupied');
                seatElement.innerHTML = `<img src="${userData.avatar || 'default_avatar.png'}" alt="User">`;
                
                // Agar yeh current user ki stream hai toh Zego audio play/publish handle hoga
            } else {
                // Agar seat khali hai
                seatElement.classList.remove('occupied');
                seatElement.innerHTML = `<i class="fas fa-microphone-slash"></i>`; // ya jo mic icon ho
            }
        }
    });
}
