    <script>
        const appID = 2003193497;
        const server = "wss://webliveroom" + appID + "-i.zegoexpress.im/ws";
        let zg = null;
        let localStream = null;
        let isMuted = false;
                // Dynamic user fetch from Firebase / Local Storage
        let savedUser = JSON.parse(localStorage.getItem('currentUser')) || {};
        
        // Dynamic User & ID creation
        const userID = savedUser.uid || ('user_' + Math.floor(100000 + Math.random() * 900000));
        const userName = savedUser.displayName || savedUser.email?.split('@')[0] || ('User_' + Math.floor(1000 + Math.random() * 9000));
let seatsData = {
    1: null,
    2: null,
    3: null,
    4: null,
    5: null,
    6: null,
    7: null,
    8: null
};
        let giftDatabase = JSON.parse(localStorage.getItem('lover_party_real_videos')) || {
            normal: [
                { name: "Rose Shower", price: 10, src: "https://www.w3schools.com/html/mov_bbb.mp4", type: "video" }
            ],
            customized: [],
            vip: [
                { name: "Sports Car", price: 500, src: "https://www.w3schools.com/html/mov_bbb.mp4", type: "video" }
            ]
        };

        function saveGifts() {
            localStorage.setItem('lover_party_real_videos', JSON.stringify(giftDatabase));
        }

        // Check if current user is Owner to show uploader panel
        function checkOwnerAccess() {
            const panel = document.getElementById('ownerUploadPanel');
            if (savedUser.isOwner || userName === 'Muhammad Farhan') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }
function renderSeats() {
    const grid = document.getElementById('seatsGrid');
    if (!grid) return;
    grid.innerHTML = '';
    
    for (let i = 1; i <= 8; i++) {
        let seatInfo = seatsData[i];
        let isOccupied = (seatInfo !== null && seatInfo !== undefined && typeof seatInfo === 'object' && seatInfo.user);
        
        let div = document.createElement('div');
        div.className = `seat-item ${isOccupied ? 'occupied' : ''} ${isOccupied && seatInfo.speaking && !seatInfo.muted ? 'speaking' : ''}`;
        
        div.onclick = () => {
            if (!isOccupied) {
                // Pehle check karein ke user pehle se kisi aur seat par hai toh wahan se uth jaye
                for (let s = 1; s <= 8; s++) {
                    if (seatsData[s] && seatsData[s].user === userName) {
                        seatsData[s] = null;
                    }
                }
                // Nayi seat par baith jaye
                seatsData[i] = { user: userName, muted: isMuted, speaking: true, ping: '24ms' };
                renderSeats();
            } else if (seatInfo.user === userName || userName === 'Muhammad Farhan' || savedUser.isOwner) {
                let action = prompt(`Seat ${i} (${seatInfo.user}): Type 'mute' to toggle mic, or 'leave' to vacate.`);
                if (action === 'mute') {
                    seatInfo.muted = !seatInfo.muted;
                    if (seatInfo.user === userName && localStream && zg) {
                        isMuted = seatInfo.muted;
                        zg.mutePublishStreamAudio(localStream, isMuted);
                        let btn = document.getElementById('micBtn');
                        if(btn) {
                            btn.innerHTML = isMuted ? "🔇 Unmuted" : "🎤 Mute";
                            btn.style.background = isMuted ? "linear-gradient(135deg, #ff3366, #cc2952)" : "linear-gradient(135deg, #2a2c4e, #1f213d)";
                        }
                    }
                    renderSeats();
                } else if (action === 'leave') {
                    seatsData[i] = null;
                    renderSeats();
                }
            }
        };

        div.innerHTML = `
            <div class="avatar-circle">
                ${i === 1 ? '<div class="crown-badge">👑</div>' : ''}
                <span class="placeholder-icon">${isOccupied ? '😊' : '🎙️'}</span>
                ${isOccupied ? `
                <div class="seat-badges">
                    <span class="ping-indicator">${seatInfo.ping || '24ms'}</span>
                    <span class="mic-badge">${seatInfo.muted ? '🔇' : '🎤'}</span>
                </div>` : ''}
            </div>
            <span class="seat-name">${isOccupied ? seatInfo.user : ('Seat ' + i)}</span>
        `;
        grid.appendChild(div);
    }
}

        function takeSeat(seatNum) {
            for (let s in seatsData) {
                if (seatsData[s] && seatsData[s].user === userName) seatsData[s] = null;
            }
            seatsData[seatNum] = { user: userName };
            renderSeats();
            addChatLog("System", `You moved to Seat ${seatNum}`);
        }

        // LEFT-TO-RIGHT FULLSCREEN VIDEO PLAYBACK WITH SOUND
        function playGiftEffect(item) {
            const overlay = document.getElementById('giftAnimationOverlay');
            overlay.style.display = 'flex';
            overlay.innerHTML = '';

            const box = document.createElement('div');
            box.className = 'flying-gift-box';
            
            const vid = document.createElement('video');
            vid.src = item.src;
            vid.autoplay = true;
            vid.controls = false;
            vid.playsInline = true;

            const label = document.createElement('div');
            label.style.cssText = "position:absolute; bottom:40px; width:100%; text-align:center; font-size:14px; color:#ffcc00; font-weight:bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index:2001;";
            label.innerText = `🎁 ${userName} sent ${item.name}!`;

            box.appendChild(vid);
            overlay.appendChild(box);
            overlay.appendChild(label);

            vid.play().catch(e => console.log("Audio play error:", e));

            // Remove overlay when full video ends
            vid.onended = () => {
                overlay.style.display = 'none';
                overlay.innerHTML = '';
            };

            // Safety fallback timer
            setTimeout(() => {
                if (overlay.style.display === 'flex') {
                    overlay.style.display = 'none';
                    overlay.innerHTML = '';
                }
            }, (vid.duration ? vid.duration * 1000 : 30000));
        }

        function uploadRealVideoGift() {
            if (userName !== 'Muhammad Farhan') {
                alert("Only Owner can upload gifts!");
                return;
            }

            const fileInput = document.getElementById('galleryVideoInput');
            const nameInput = document.getElementById('uploadGiftName').value;
            const priceInput = document.getElementById('uploadGiftPrice').value;

            if (fileInput.files.length === 0 || !nameInput || !priceInput) {
                alert("Please select a video file, enter name and price!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const videoBase64 = e.target.result;
                giftDatabase.customized.push({
                    name: nameInput,
                    price: parseInt(priceInput),
                    src: videoBase64,
                    type: "video"
                });

                saveGifts();
                alert("Fullscreen video gift uploaded successfully!");
                
                fileInput.value = '';
                document.getElementById('uploadGiftName').value = '';
                document.getElementById('uploadGiftPrice').value = '';
                switchGiftTab('customized');
            };

            reader.readAsDataURL(file);
        }

        function openGiftModal() {
            checkOwnerAccess();
            document.getElementById('giftModal').style.display = 'block';
            switchGiftTab('customized');
        }

        function closeGiftModal() {
            document.getElementById('giftModal').style.display = 'none';
        }

        function switchGiftTab(cat) {
            ['normal', 'customized', 'vip'].forEach(c => {
                document.getElementById('tab-btn-' + c).classList.remove('active');
            });
            document.getElementById('tab-btn-' + cat).classList.add('active');

            const container = document.getElementById('giftItemsContainer');
            container.innerHTML = '';

            let items = giftDatabase[cat];
            if (!items || items.length === 0) {
                container.innerHTML = '<div style="grid-column: span 4; text-align:center; font-size:11px; color:#aaa; padding:20px;">No gifts here.</div>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'gift-card';
                card.innerHTML = `
                    <video src="${item.src}" muted playsinline></video>
                    <span style="font-size:9px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center;">${item.name}</span>
                    <span style="font-size:8px; color:#ff9933;">🪙 ${item.price}</span>
                `;
card.onclick = () => {
    let price = BigInt(item.price || 0);
    let currentCoins = BigInt(localStorage.getItem('userCoins') || localStorage.getItem('user_coins') || "0");

    if (currentCoins >= price) {
        currentCoins -= price;
        
        // Storage updates for live cross-page sync
        localStorage.setItem('userCoins', currentCoins.toString());
        localStorage.setItem('user_coins', currentCoins.toString());

        // Refresh coin display in room
        if (typeof syncCoinDisplays === 'function') {
            syncCoinDisplays();
        }

        playGiftEffect(item);
        addChatLog("Gift 🎁", `${userName} sent ${item.name}!`);
        closeGiftModal();
    } else {
        alert("Coins kam hain! Pehle profile se recharge karein.");
    }
};

                container.appendChild(card);
            });
        }

        async function initZegoLiveRoom() {
            try {
                zg = new ZegoExpressEngine(appID, server);
                await zg.loginRoom('lover_room_101', "", { userID: userID, userName: userName }, { userUpdate: true });
                              zg.on('roomStreamUpdate', async (roomID, updateType, streamList) => {
                    if (updateType === 'ADD') {
                        for (let stream of streamList) {
                            let streamID = stream.streamID;
                            let remoteStream = await zg.startPlayingStream(streamID);
                            const audioContainer = document.getElementById('remoteAudioContainer');
                            let audioEl = document.createElement('audio');
                            audioEl.srcObject = remoteStream;
                            audioEl.autoplay = true;
                            audioEl.id = 'audio_' + streamID;
                            audioContainer.appendChild(audioEl);
                        }
                    } else if (updateType === 'DELETE') {
                        for (let stream of streamList) {
                            zg.stopPlayingStream(stream.streamID);
                            let el = document.getElementById('audio_' + stream.streamID);
                            if (el) el.remove();
                        }
                    }
                });
                localStream = await zg.createStream({ camera: { audio: true, video: false } });
                await zg.startPublishingStream('stream_' + userID, localStream);
                document.getElementById('statusBanner').innerText = "Zego Voice Connected";
            } catch (err) {
                document.getElementById('statusBanner').innerText = "Interactive Room Ready";
            }
        }

        function toggleMic() {
            isMuted = !isMuted;
            if (localStream && zg) {
                try { zg.mutePublishStreamAudio(localStream, isMuted); } catch(e){}
            }
            const btn = document.getElementById('micBtn');
            btn.innerHTML = isMuted ? "🔇 Unmuted" : "🎤 Mute";
            btn.style.background = isMuted ? "linear-gradient(135deg, #ff3366, #cc2952)" : "linear-gradient(135deg, #2a2c4e, #1f213d)";
        }

        function sendChatMsg() {
            let msg = prompt("Enter chat message:");
            if (msg) addChatLog(userName, msg);
        }

        function addChatLog(sender, text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<span>${sender}:</span> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        // Coin Key Definition
        const COIN_KEY = 'user_coins_balance';

        function getOwnerCoins() {
            let coins = localStorage.getItem(COIN_KEY);
            if (!coins) {
                coins = "5000000000000000000000000";
                localStorage.setItem(COIN_KEY, coins);
            }
            return coins;
        }

        function syncCoinDisplays() {
            let currentCoins = getOwnerCoins();
            let formattedCoins;
            try {
                let bigCoins = BigInt(currentCoins);
                formattedCoins = bigCoins > 1000000n ? bigCoins.toLocaleString() : bigCoins.toString();
            } catch (e) {
                formattedCoins = currentCoins;
            }
            const modalCoinEl = document.getElementById('modalCoinsDisplay');
            if (modalCoinEl) modalCoinEl.innerText = formattedCoins;
        }

        function sendGiftItem(item) {
            let currentCoins = BigInt(getOwnerCoins());
            let giftPrice = BigInt(item.price || 0);

            if (currentCoins < giftPrice) {
                alert("Insufficient Coin Balance!");
                return;
            }

            let newBalance = currentCoins - giftPrice;
            localStorage.setItem(COIN_KEY, newBalance.toString());

            syncCoinDisplays();
            playGiftEffect(item);
            addChatLog("Gift 🎁", `${userName} sent ${item.name}!`);
            closeGiftModal();
        }

        function switchGiftTab(cat) {
            ['normal', 'customized', 'vip'].forEach(c => {
                document.getElementById('tab-btn-' + c).classList.remove('active');
            });
            document.getElementById('tab-btn-' + cat).classList.add('active');

            const container = document.getElementById('giftItemsContainer');
            container.innerHTML = '';

            let items = giftDatabase[cat];
            if (!items || items.length === 0) {
                container.innerHTML = '<div style="grid-column: span 4; text-align:center; font-size:11px; color:#aaa; padding:20px;">No gifts here.</div>';
                return;
            }

            items.forEach(item => {
                let card = document.createElement('div');
                card.className = 'gift-card';
                card.innerHTML = `
                    <video src="${item.src}" muted playsinline></video>
                    <span style="font-size:9px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center;">${item.name}</span>
                    <span style="font-size:8px; color:#ff9933;">🪙 ${item.price}</span>
                `;
                card.onclick = () => sendGiftItem(item);
                container.appendChild(card);
            });

            syncCoinDisplays();
        }

        function leaveRoom() {
            if (zg) { try { zg.logoutRoom('lover_room_101'); } catch(e){} }
            alert("Left room.");
        }

                window.addEventListener('DOMContentLoaded', () => {
            renderSeats();
            checkOwnerAccess();
            initZegoLiveRoom();
            syncCoinDisplays();
        });
    // VIP Entrance Animation Trigger
    function showVipRoomEntrance() {
        let vipLevel = localStorage.getItem('userVipLevel') || 25;
        let userName = localStorage.getItem('userName') || "Muhammad Farhan";

        if (parseInt(vipLevel) > 0) {
            let flashDiv = document.createElement('div');
            flashDiv.className = 'vip-flash-bg';
            document.body.appendChild(flashDiv);
            setTimeout(() => { if(flashDiv) flashDiv.remove(); }, 1500);

            let overlay = document.getElementById('vipEntranceOverlay');
            let titleElem = document.getElementById('vipTitleText');
            let userElem = document.getElementById('vipUserText');

            if (titleElem) titleElem.innerHTML = `👑 VIP ${vipLevel} ARRIVED ✨`;
            if (userElem) userElem.innerHTML = `<span style="color:#ffd700;">${userName}</span> entered the room!`;

            if (overlay) {
                overlay.classList.add('active');
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 3500);
            }
        }
    }

    // User Roles & Session Security Check
    function getAuthenticatedUser() {
        let sessionUser = sessionStorage.getItem('activeUserSession');
        if (!sessionUser) {
            let name = localStorage.getItem('userName') || "Muhammad Farhan";
            let vip = parseInt(localStorage.getItem('userVipLevel')) || 25;
            let role = localStorage.getItem('userRole') || (vip >= 20 ? 'host' : 'member');
            let token = 'SEC_TOKEN_' + Math.random().toString(36).substr(2, 9).toUpperCase();

            sessionUser = JSON.stringify({
                userName: name,
                vipLevel: vip,
                role: role,
                token: token,
                sessionStart: Date.now()
            });
            sessionStorage.setItem('activeUserSession', sessionUser);
        }
        return JSON.parse(sessionUser);
    }

    // Auto Security Initialization & Entrance Call
    window.addEventListener('DOMContentLoaded', () => {
renderSeats();
      const currentUser = getAuthenticatedUser();
        console.log("🔒 Secure Session Active:", currentUser.userName, "| Role:", currentUser.role);

        setTimeout(() => {
            showVipRoomEntrance();
        }, 1000);
    });

    </script>
</body>
