<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVER PARTY APP - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0d0b21; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 70px; overflow-x: hidden; }
        .top-tabs { display: flex; background: #151238; padding: 0 10px; border-bottom: 1px solid #2a265f; overflow-x: auto; white-space: nowrap; }
        .top-tabs::-webkit-scrollbar { display: none; }
        .top-tab-item { padding: 12px 16px; font-size: 13px; color: #a09cb0; cursor: pointer; border-bottom: 2px solid transparent; }
        .top-tab-item.active { color: #ff3366; border-bottom-color: #ff3366; font-weight: bold; }
        .section-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .section-header h3 { font-size: 14px; color: #a09cb0; }
        .create-room-btn { background: linear-gradient(135deg, #ff3366, #ff6b8b); color: white; border: none; padding: 6px 14px; border-radius: 15px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .rooms-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 15px; }
        .room-card { background: #1a1744; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #2a265f; display: flex; flex-direction: column; justify-content: space-between; height: 150px; position: relative; }
        .room-card-img { width: 100%; height: 75px; object-fit: cover; background: #25215c; }
        .room-card-info { padding: 8px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
        .room-card h4 { font-size: 13px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .room-tag { position: absolute; top: 6px; right: 6px; background: rgba(0, 0, 0, 0.6); color: #ff3366; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
        #create-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #151238; padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; border: 1px solid #2a265f; }
        .modal-box input, .modal-box select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0d0b21; border: 1px solid #2a265f; border-radius: 8px; color: white; font-size: 13px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
        .modal-actions button { padding: 7px 14px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-cancel { background: #2a265f; color: white; }
        .btn-create { background: #ff3366; color: white; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #151238; border-top: 1px solid #2a265f; display: flex; justify-content: space-around; padding: 8px 0; z-index: 500; }
        .nav-item { text-align: center; color: #a09cb0; text-decoration: none; font-size: 10px; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: #ff3366; }
        .nav-item div { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="top-tabs">
        <div class="top-tab-item">Following</div>
        <div class="top-tab-item active">Explore</div>
        <div class="top-tab-item">New</div>
    </div>

    <div class="section-header">
        <h3>Live Voice Rooms</h3>
        <button class="create-room-btn" onclick="openModal()">+ Create Room</button>
    </div>

    <!-- Real-time Rooms Container -->
    <div class="rooms-grid" id="roomsContainer">
        <p style="color: #a09cb0; grid-column: span 2; text-align: center; padding: 20px;">Loading live rooms...</p>
    </div>

    <!-- Create Room Modal -->
    <div id="create-modal">
        <div class="modal-box">
            <h3 style="color: #ff3366; margin-bottom: 10px;">Create Voice Room</h3>
            <input type="text" id="roomTitleInput" placeholder="Enter Room Title...">
            <label style="font-size: 11px; color: #a09cb0; display:block; margin-bottom:4px;">Room Banner Image:</label>
            <input type="file" id="roomImageInput" accept="image/*">
            <select id="roomCapacityInput">
                <option value="4">4 Seats</option>
                <option value="8">8 Seats</option>
                <option value="16" selected>16 Seats</option>
            </select>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-create" onclick="createRoom()">Go Live</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="location.href='home.html'"><div>🏠</div>Home</button>
        <button class="nav-item" onclick="location.href='profile.html'"><div>👤</div>Profile</button>
    </div>

    <!-- Firebase SDKs & Real-time Database Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsEDoAGFNF-CQknP25rhWP_RoxtvgeCjc",
            authDomain: "loverpartyapp.firebaseapp.com",
            databaseURL: "https://loverpartyapp-default-rtdb.firebaseio.com",
            projectId: "loverpartyapp",
            storageBucket: "loverpartyapp.firebasestorage.app",
            messagingSenderId: "1064077187047",
            appId: "1:1064077187047:web:24f05ce5328a31a9f34f42"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const roomsRef = ref(db, 'rooms');

        // Real-time listener to fetch and display active rooms from Firebase
        onValue(roomsRef, (snapshot) => {
            const data = snapshot.val();
            const roomsContainer = document.getElementById('roomsContainer');
            roomsContainer.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(key => {
                    const room = data[key];
                    roomsContainer.innerHTML += `
                        <div class="room-card" onclick="window.location.href='room.html?roomId=${room.id}&name=${encodeURIComponent(room.name)}&seats=${room.seats}&image=${encodeURIComponent(room.image || '')}'">
                            <span class="room-tag">${room.seats} Seats</span>
                            <img src="${room.image || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300'}" class="room-card-img" alt="Room Banner">
                            <div class="room-card-info">
                                <h4>${room.name}</h4>
                                <p style="font-size:10px; color:#a09cb0;">Tap to Join Live</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                roomsContainer.innerHTML = '<p style="color: #a09cb0; grid-column: span 2; text-align: center; padding: 20px;">No active rooms right now.</p>';
            }
        });

        window.openModal = function() {
            document.getElementById('create-modal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('create-modal').style.display = 'none';
        }

        window.createRoom = function() {
            const title = document.getElementById('roomTitleInput').value.trim();
            const seats = document.getElementById('roomCapacityInput').value;
            const imageInput = document.getElementById('roomImageInput');

            if(!title) {
                alert('Please enter a room title');
                return;
            }

            if(imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveRoomToFirebase(title, seats, e.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveRoomToFirebase(title, seats, 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300');
            }
        }

        function saveRoomToFirebase(title, seats, imageUrl) {
            const newRoomRef = push(roomsRef);
            const roomId = newRoomRef.key;

            set(newRoomRef, {
                id: roomId,
                name: title,
                seats: parseInt(seats),
                image: imageUrl,
                createdAt: Date.now()
            }).then(() => {
                closeModal();
                window.location.href = `room.html?roomId=${roomId}&name=${encodeURIComponent(title)}&seats=${seats}&image=${encodeURIComponent(imageUrl)}`;
            }).catch((err) => {
                alert("Error creating room: " + err.message);
            });
        }
    </script>
</body>
</html>
