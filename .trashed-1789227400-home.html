<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVER PARTY APP - Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f0c29; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 70px; }
        
        /* Top Navigation Bar */
        .top-nav { display: flex; justify-content: space-around; align-items: center; padding: 15px 10px; background: #15102b; border-bottom: 1px solid #2b234d; width: 100%; position: sticky; top: 0; z-index: 10; }
        .top-nav span { color: #8b88a8; font-size: 16px; font-weight: bold; cursor: pointer; }
        .top-nav span.active { color: white; border-bottom: 2px solid #ff416c; padding-bottom: 4px; }

        /* Filter Pills */
        .filter-scroll { display: flex; gap: 10px; padding: 12px 15px; overflow-x: auto; white-space: nowrap; width: 100%; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-pill { background: #1a1532; padding: 8px 16px; border-radius: 20px; font-size: 14px; color: #ccc; border: 1px solid #2b234d; cursor: pointer; }
        .filter-pill.active { background: #ff416c; color: white; border: none; }

        /* Country Flag Scroll Bar */
        .flag-scroll { display: flex; gap: 12px; padding: 0 15px 12px 15px; overflow-x: auto; white-space: nowrap; width: 100%; align-items: center; }
        .flag-scroll::-webkit-scrollbar { display: none; }
        .flag-pill { background: #1a1532; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #fff; border: 1px solid #2b234d; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .flag-pill.active { background: #2b234d; border-color: #ff416c; }

        /* Banners */
        .banner-container { display: flex; gap: 12px; padding: 0 15px 15px 15px; width: 100%; max-width: 500px; }
        .banner-card { flex: 1; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 15px; }
        .banner-honor { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #333; }
        .banner-activity { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); color: #111; }

        /* Content */
        .content-grid { padding: 0 15px; width: 100%; max-width: 500px; min-height: 250px; }
        .empty-state { background: #1a1532; border: 2px dashed #2b234d; border-radius: 12px; padding: 40px 20px; text-align: center; color: #8b88a8; margin-top: 10px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #15102b; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 1px solid #2b234d; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8b88a8; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: #ff416c; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="top-nav">
        <span>Following</span>
        <span class="active">Explore</span>
        <span>New</span>
        <span>Nearby</span>
    </div>

    <!-- Category Filter Pills -->
    <div class="filter-scroll">
        <div class="filter-pill active">Popular</div>
        <div class="filter-pill">PK Pakistan</div>
        <div class="filter-pill">PH Philippines</div>
    </div>

    <!-- Country Flags Horizontal Scroll Bar -->
    <div class="flag-scroll">
        <div class="flag-pill active">🌐 All</div>
        <div class="flag-pill">🇵🇰 Pakistan</div>
        <div class="flag-pill">🇵🇭 Philippines</div>
        <div class="flag-pill">🇮🇳 India</div>
        <div class="flag-pill">🇸🇦 Saudi Arabia</div>
        <div class="flag-pill">🇦🇪 UAE</div>
        <div class="flag-pill">🇺🇸 USA</div>
        <div class="flag-pill">🇬🇧 UK</div>
    </div>

    <!-- Banners -->
    <div class="banner-container">
        <div class="banner-card banner-honor"><span>Honor</span><span>👑</span></div>
        <div class="banner-card banner-activity"><span>Activity Center</span><span>⭐</span></div>
    </div>

    <!-- Content Area -->
    <div class="content-grid">
        <div class="empty-state">
            <p>No active rooms right now.</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>Discover</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Moments</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile</div>
    </div>
</body>
</html>
