<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVER PARTY APP - Login</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #0f0c29;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        #logo-container img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff416c;
            box-shadow: 0 0 15px #ff416c;
            object-fit: cover;
        }
        #auth-container {
            background: #1a1532;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #2b234d;
            background: #15102b;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #ff416c;
        }
        button {
            width: 93%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .social-btn {
            background: #ffffff;
            color: #333;
        }
        .phone-btn {
            background: #25d366;
            color: white;
        }
        button:active {
            opacity: 0.9;
        }
        #error-message {
            color: #ff4b2b;
            font-size: 13px;
            margin-top: 10px;
            word-break: break-all;
        }
        .divider {
            margin: 12px 0;
            color: #888;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <img src="icon.png" alt="Lover Party Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
        <h1>LOVER PARTY APP</h1>
    </div>

    <div id="auth-container">
        <!-- Email / Password Section -->
        <div id="email-section">
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button id="login-btn" type="button">Login with Email</button>
            <button id="signup-btn" type="button">Sign Up with Email</button>
        </div>

        <div class="divider">OR</div>

        <!-- Phone Auth Section -->
        <div id="phone-section">
            <input type="text" id="phone-number" placeholder="Phone (e.g. 03150009309)" required>
            <button id="send-otp-btn" type="button" class="phone-btn">Send OTP SMS</button>
            
            <div id="otp-container" class="hidden">
                <input type="text" id="otp-code" placeholder="Enter 6-digit OTP" required>
                <button id="verify-otp-btn" type="button">Verify OTP & Login</button>
            </div>
            <!-- Invisible reCAPTCHA container required by Firebase Phone Auth -->
            <div id="recaptcha-container"></div>
        </div>

        <div class="divider">OR</div>
        
        <button id="google-btn" type="button" class="social-btn">Login with Google</button>
        
        <p id="error-message"></p>
    </div>

    <!-- Firebase SDKs (Compat Version 9.22.0) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsEDoAGFNF-CQknP25rhWP_RoxtvgeCjc",
            authDomain: "loverpartyapp.firebaseapp.com",
            databaseURL: "https://loverpartyapp-default-rtdb.firebaseio.com",
            projectId: "loverpartyapp",
            storageBucket: "loverpartyapp.firebasestorage.app",
            messagingSenderId: "1064077187047",
            appId: "1:1064077187047:web:24f05ce5328a31a9f34f42",
            measurementId: "G-K7BV8V510W"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.database();

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const errorDisplay = document.getElementById("error-message");

        // Helper function to create user profile in Realtime Database
        async function createUserProfile(user, customUsername = "Muhammad Farhan") {
            const userRef = db.ref('users/' + user.uid);
            userRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    userRef.set({
                        uid: user.uid,
                        email: user.email || "",
                        phone: user.phoneNumber || "",
                        username: customUsername,
                        coins: 35,
                        points: 21462,
                        customId: Math.floor(10000000 + Math.random() * 90000000),
                        friends: 3,
                        following: 3,
                        followers: 236,
                        visitors: 0,
                        createdAt: new Date().toISOString()
                    });
                }
            });
        }

        // 1. Register User Function
        function registerUser(email, password, username) {
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    createUserProfile(user, username || "Muhammad Farhan");
                    alert("Account Successfully Created!");
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    console.error("Signup Error: ", error.message);
                    errorDisplay.textContent = error.message;
                });
        }

        // 2. Login User Function
        function loginUser(email, password) {
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    db.ref('users/' + user.uid).once('value').then((snapshot) => {
                        const userData = snapshot.val();
                        if(userData) {
                            alert("Welcome back, " + userData.username);
                            window.location.href = "home.html";
                        } else {
                            createUserProfile(user);
                            window.location.href = "home.html";
                        }
                    });
                })
                .catch((error) => {
                    console.error("Login Error: ", error.message);
                    errorDisplay.textContent = error.message;
                });
        }

        // Email Login Event
        document.getElementById("login-btn").onclick = function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) {
                errorDisplay.textContent = "Please enter email and password.";
                return;
            }
            errorDisplay.textContent = "Logging in...";
            loginUser(email, password);
        };

        // Email Signup Event
        document.getElementById("signup-btn").onclick = function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) {
                errorDisplay.textContent = "Please enter email and password.";
                return;
            }
            errorDisplay.textContent = "Creating account...";
            registerUser(email, password);
        };

        // Google Sign-In using Redirect Method
        document.getElementById("google-btn").onclick = async function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({
                'prompt': 'select_account'
            });

            errorDisplay.textContent = "Redirecting to Google...";
            try {
                await auth.signInWithRedirect(provider);
            } catch (error) {
                errorDisplay.textContent = error.message;
            }
        };

        // Handle Google Redirect Result on Page Load
        auth.getRedirectResult().then(async function(result) {
            if (result.user) {
                await createUserProfile(result.user, result.user.displayName || "Muhammad Farhan");
                window.location.href = "home.html";
            }
        }).catch(function(error) {
            if (error.message) {
                errorDisplay.textContent = error.message;
            }
        });

        // Phone Authentication Setup
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible'
            });
        };

        document.getElementById("send-otp-btn").onclick = function() {
            let phoneNumber = document.getElementById("phone-number").value.trim();
            
            if (!phoneNumber) {
                errorDisplay.textContent = "Please enter a phone number.";
                return;
            }

            if (phoneNumber.startsWith("0")) {
                phoneNumber = "+92" + phoneNumber.substring(1);
            } else if (!phoneNumber.startsWith("+")) {
                phoneNumber = "+" + phoneNumber;
            }

            errorDisplay.textContent = "Sending OTP SMS to " + phoneNumber + "...";
            const appVerifier = window.recaptchaVerifier;

            auth.signInWithPhoneNumber(phoneNumber, appVerifier)
                .then(function (confirmationResult) {
                    window.confirmationResult = confirmationResult;
                    errorDisplay.textContent = "OTP sent successfully! Check your phone.";
                    document.getElementById("otp-container").classList.remove("hidden");
                    document.getElementById("send-otp-btn").classList.add("hidden");
                }).catch(function (error) {
                    errorDisplay.textContent = "SMS Error: " + error.message;
                });
        };

        document.getElementById("verify-otp-btn").onclick = function() {
            const code = document.getElementById("otp-code").value.trim();
            if (!code) {
                errorDisplay.textContent = "Please enter the 6-digit OTP code.";
                return;
            }

            errorDisplay.textContent = "Verifying OTP...";
            window.confirmationResult.confirm(code).then(async function (result) {
                const user = result.user;
                await createUserProfile(user);
                errorDisplay.textContent = "Success! Redirecting...";
                window.location.href = "home.html";
            }).catch(function (error) {
                errorDisplay.textContent = "Invalid OTP code: " + error.message;
            });
        };
    </script>

</body>
</html>
